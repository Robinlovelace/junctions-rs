name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run --release -p junctions-core --example benchmark

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # maturin develop requires an active virtualenv; create one explicitly.
      - run: |
          python -m venv .venv
          .venv/bin/pip install maturin pytest
          .venv/bin/maturin develop --release
          .venv/bin/pytest -q python-tests

  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate extendr wrappers
        run: |
          Rscript -e 'install.packages(c("roxygen2", "rextendr"), repos = "https://cloud.r-project.org")'
          Rscript -e 'rextendr::document("r/junctionsrs")'
      - name: Install package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/junctionsrs
          extra-packages: any::testthat, any::jsonlite
      - name: R CMD check
        env:
          _R_CHECK_FORCE_SUGGESTS_: false
        run: R CMD check r/junctionsrs --no-manual --as-cran
