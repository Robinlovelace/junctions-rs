[workspace]
resolver = "3"
members = ["crates/junctions-core", "crates/junctions-cli", "bindings/python", "bindings/wasm"]
default-members = ["crates/junctions-core", "crates/junctions-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Robinlovelace/junctions-rs"
authors = ["Robin Lovelace"]

[workspace.dependencies]
geo = "0.31"
geo-types = "0.7"
geojson = "0.24"
rstar = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
